<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Talk2Me</title>
        <script type="importmap">
            {
                "imports": {
                    "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.32/dist/vue.esm-browser.js",
                    "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@5.0.4/dist/vue-router.esm-browser.prod.js",
                    "@graffiti-garden/implementation-local": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-local@1.2.0/dist/browser/index.js",
                    "@graffiti-garden/implementation-decentralized": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-decentralized@0.0.9/dist/browser/index.js",
                    "@graffiti-garden/wrapper-vue": "https://cdn.jsdelivr.net/npm/@graffiti-garden/wrapper-vue@1.2.2/dist/browser/plugin.mjs"
                }
            }
        </script>
        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="./components/contact/contact.css" />
        <link rel="stylesheet" href="./components/contacts/contacts.css" />
        <link rel="stylesheet" href="./components/NewObjectSidebar/NewObjectSidebar.css" />
        <link rel="stylesheet" href="./components/FolderSidebar/FolderSidebar.css" />
        <link rel="stylesheet" href="./components/RootSidebar/RootSidebar.css" />
        <link rel="stylesheet" href="./components/ObjectMenu/ObjectMenu.css" />
        <link rel="stylesheet" href="./components/chat/Chat.css" />
        <link rel="stylesheet" href="./components/home/home.css" />
        <link rel="stylesheet" href="./components/inbox/inbox.css" />
        <script src="./main.js" type="module"></script>
    </head>
    <body>
        <div id="app">Loading...</div>
        <template id="template">
            <header>
                <h1>Talk2Me</h1>
            </header>

            <main>
                <button v-if="!$graffitiSession.value" @click="$graffiti.login()">
                    Log In
                </button>
                <template v-else>
                    <!-- Login header -->
                    <p class="app-intro">Logged in as: <graffiti-actor-to-handle :actor="$graffitiSession.value?.actor"></graffiti-actor-to-handle></p>

                    <div class="app-topbar">
                        <!-- <button @click="deleteContacts" :disabled="deleting">
                            {{deleting? 'Deleting...':'Delete Contacts'}}
                        </button>
                        <button @click="deleteObjects" :disabled="deleting">
                            {{deleting? 'Deleting...':'Delete Objects'}}
                        </button> -->
                        <nav class="app-tabs" aria-label="Primary navigation">
                            <router-link to="/" custom v-slot="{ navigate, isActive }">
                                <button
                                    type="button"
                                    class="app-tab app-tab--icon"
                                    :class="{ 'app-tab--active': isActive }"
                                    aria-label="Home"
                                    @click="navigate"
                                >
                                    <img src="./media/home.svg" alt="" />
                                    <span class="app-tab__label">Home</span>
                                </button>
                            </router-link>
                            <router-link to="/inbox" custom v-slot="{ navigate, isActive }">
                                <button
                                    type="button"
                                    class="app-tab"
                                    :class="{
                                        'app-tab--active': isActive,
                                        'inbox-button--ring': inboxBellRinging,
                                    }"
                                    aria-label="Inbox"
                                    @click="navigate"
                                >
                                    <span class="inbox-button__bell" aria-hidden="true">
                                        <img src="./media/bell.svg" class="icon inbox-button__bell-icon" alt="" />
                                        <span v-if="inboxUnreadCount" class="inbox-button__dot" aria-hidden="true"></span>
                                    </span>
                                    <span class="app-tab__label">Inbox</span>
                                </button>
                            </router-link>
                            <router-link to="/contacts" custom v-slot="{ navigate, isActive }">
                                <button
                                    type="button"
                                    class="app-tab"
                                    :class="{ 'app-tab--active': isActive }"
                                    aria-label="Contacts"
                                    @click="navigate"
                                >
                                    <img src="./media/contacts.svg" class="icon"/>
                                    <span class="app-tab__label">Contacts</span>
                                </button>
                            </router-link>
                            <button
                                type="button"
                                class="app-tab"
                                aria-label="Log Out"
                                @click="$graffiti.logout($graffitiSession.value)"
                            >
                                <img src="./media/logout.svg" class="icon"/>
                                <span class="app-tab__label">Log Out</span>
                            </button>
                            <span class="app-tabs__indicator" aria-hidden="true"></span>
                        </nav>
                    </div>



                    <!-- <p>router!</p> -->
                    <router-view
                        :session="session"
                        :graffiti="graffiti"
                        :app-name="appName"
                        :contacts="contacts"
                        :all-objects="allObjects"
                        :folders="folders"
                        :folder-nav-stack="folderNavStack"
                        :open-chat-channel="openChatChannel"
                        :open-chat="openChat"
                        :folder-updates="folderUpdates"
                        :chat-deletion-cutoffs="chatDeletionCutoffs"
                        :hidden-chat-channels="hiddenChatChannels"
                        :muted-contact-actors="mutedContactActors"
                        :muted-chat-channels="mutedChatChannels"
                        :muted-folder-channels="mutedFolderChannels"
                        :prefetched-messages-by-channel="prefetchedMessagesByChannel"
                        :prefetched-participant-updates-by-channel="prefetchedParticipantUpdatesByChannel"
                        @change-chat-channel="changeChatChannel"
                        @change-nav-stack="changeNavStack"
                    >
                    </router-view>
                    <!-- <p>router!</p> -->
                </template>

            </main>
        </template>
    </body>
</html>
